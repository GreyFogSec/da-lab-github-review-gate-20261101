name: AWS SDK Ruby review-to-OIDC - lab model

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  vulnerable-cloud-build:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      issues: write
      pull-requests: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEWER: ${{ github.event.review.user.login }}
      REVIEW_ASSOCIATION: ${{ github.event.review.author_association }}
      REVIEW_COMMIT: ${{ github.event.review.commit_id }}
    steps:
      - name: Request AWS-audience OIDC token and record safe claims
        id: oidc
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(jq -r '.value' <<<"$RESPONSE")
          test -n "$OIDC_TOKEN"
          CLAIMS=$(OIDC_TOKEN="$OIDC_TOKEN" node -e \
            'const p=process.env.OIDC_TOKEN.split(".")[1]; process.stdout.write(Buffer.from(p,"base64url").toString())')
          SAFE_CLAIMS=$(jq -c '{iss,aud,sub,repository,repository_owner,repository_visibility,workflow,workflow_ref,event_name,actor,actor_id,ref,sha,run_id,run_attempt}' <<<"$CLAIMS")
          CLAIMS_HASH=$(printf '%s' "$SAFE_CLAIMS" | sha256sum | cut -d' ' -f1)
          SUB=$(jq -r '.sub' <<<"$SAFE_CLAIMS")
          AUD=$(jq -r '.aud' <<<"$SAFE_CLAIMS")
          ACTOR=$(jq -r '.actor' <<<"$SAFE_CLAIMS")
          echo "safe_claims=$SAFE_CLAIMS"
          echo "claims_sha256=$CLAIMS_HASH"
          echo "sub=$SUB" >> "$GITHUB_OUTPUT"
          echo "aud=$AUD" >> "$GITHUB_OUTPUT"
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
          echo "claims_hash=$CLAIMS_HASH" >> "$GITHUB_OUTPUT"

      - name: Record bounded cloud-build receipt on the PR
        env:
          OIDC_SUB: ${{ steps.oidc.outputs.sub }}
          OIDC_AUD: ${{ steps.oidc.outputs.aud }}
          OIDC_ACTOR: ${{ steps.oidc.outputs.actor }}
          CLAIMS_HASH: ${{ steps.oidc.outputs.claims_hash }}
        run: |
          BODY=$(cat <<EOF
          LAB cloud-build receipt (no AWS call performed)

          - triggering reviewer: \`$REVIEWER\`
          - review association: \`$REVIEW_ASSOCIATION\`
          - reviewed commit: \`$REVIEW_COMMIT\`
          - OIDC actor: \`$OIDC_ACTOR\`
          - OIDC audience: \`$OIDC_AUD\`
          - OIDC subject: \`$OIDC_SUB\`
          - safe-claims SHA-256: \`$CLAIMS_HASH\`
          EOF
          )
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f "body=$BODY" --jq '{id,html_url}'

  authorize-hardened-cloud-build:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEWER: ${{ github.event.review.user.login }}
      REVIEW_COMMIT: ${{ github.event.review.commit_id }}
    steps:
      - name: Authorize before granting any OIDC permission
        id: authorization
        run: |
          PERMISSION=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$REVIEWER/permission" --jq '.permission' 2>/dev/null || echo none)
          CURRENT_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          AUTHORIZED=false
          case "$PERMISSION" in
            admin|maintain|write)
              if [ "$REVIEW_COMMIT" = "$CURRENT_HEAD" ]; then
                AUTHORIZED=true
              fi
              ;;
          esac
          echo "permission=$PERMISSION"
          echo "review_commit=$REVIEW_COMMIT"
          echo "current_head=$CURRENT_HEAD"
          echo "authorized=$AUTHORIZED" >> "$GITHUB_OUTPUT"

  hardened-cloud-build:
    needs: authorize-hardened-cloud-build
    if: needs.authorize-hardened-cloud-build.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Hardened OIDC sink
        run: |
          echo 'ERROR: unprivileged reviewer unexpectedly received hardened OIDC job' >&2
          exit 1
